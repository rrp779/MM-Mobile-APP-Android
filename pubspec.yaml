name: Makeupmysteryindia
description: MakeupMysteryIndia Shopify Flutter App
version: 1.0.16+23
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.6.0
  flutter_dotenv: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  flutter:
    sdk: flutter

  graphql_flutter: ^5.1.2
  cupertino_icons: ^1.0.6
  provider: ^6.1.5+1
  carousel_slider: ^5.0.0
  flutter_html: ^3.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  webview_flutter: ^4.4.2
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  scrollable_positioned_list: ^0.3.8
  google_fonts: ^6.2.1
  firebase_auth: ^5.7.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  cloud_firestore: ^5.4.0
  flutterfire_cli: ^1.3.1
  dotted_border: ^2.1.0
  video_player: ^2.8.2
  cached_video_player_plus: ^4.1.0
  app_links: ^6.4.1
  crypto: ^3.0.7
  flutter_secure_storage: ^10.0.0
  razorpay_flutter: ^1.3.6

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

dependency_overrides:
  razorpay_flutter:
    path: patched_packages/razorpay_flutter
  share_plus:
    path: patched_packages/share_plus

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon.png
    - assets/logo.png
    - assets/splash.png
    - assets/icons/
    - assets/pink-background.png
