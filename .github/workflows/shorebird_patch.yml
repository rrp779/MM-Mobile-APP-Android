name: Shorebird OTA Patch

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to patch'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  patch-android:
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: shorebirdtech/actions/setup-shorebird@v1
        with:
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}
      - run: shorebird run flutter pub get
      - run: shorebird patch android --force

  patch-ios:
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: shorebirdtech/actions/setup-shorebird@v1
        with:
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}
      - run: shorebird run flutter pub get
      - run: shorebird patch ios --force
