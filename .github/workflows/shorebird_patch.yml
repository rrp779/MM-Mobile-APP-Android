name: Shorebird OTA Patch

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to patch'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      release_version:
        description: 'Exact Shorebird release to patch, e.g. 1.0.30+37 (must match the build installed from the store)'
        required: true
        type: string
      allow_native_diffs:
        description: 'UNSAFE: publish even if native code changed (native changes never ship via OTA)'
        required: false
        default: false
        type: boolean
      allow_asset_diffs:
        description: 'UNSAFE: publish even if assets changed'
        required: false
        default: false
        type: boolean

env:
  RELEASE_VERSION: ${{ inputs.release_version }}
  EXTRA_PATCH_FLAGS: ${{ inputs.allow_native_diffs && '--allow-native-diffs' || '' }} ${{ inputs.allow_asset_diffs && '--allow-asset-diffs' || '' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::release_version must look like 1.0.30+37 (got '$RELEASE_VERSION')"
            exit 1
          fi
          echo "Patching release $RELEASE_VERSION, extra flags: '${EXTRA_PATCH_FLAGS// /}'"

  patch-android:
    needs: validate
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Decode Android Keystore and configure key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Shorebird Doctor
        run: shorebird doctor --verbose

      - name: Shorebird Patch Android
        run: shorebird patch android --release-version="$RELEASE_VERSION" $EXTRA_PATCH_FLAGS --verbose

  patch-ios:
    needs: validate
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-15
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Shorebird Doctor
        run: shorebird doctor --verbose

      - name: Shorebird Patch iOS
        run: shorebird patch ios --release-version="$RELEASE_VERSION" --no-codesign $EXTRA_PATCH_FLAGS --verbose
