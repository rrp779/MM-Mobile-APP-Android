name: Shorebird Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build release for'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  release-android:
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Shorebird Doctor
        run: shorebird doctor --verbose

      - name: Shorebird Release Android
        run: shorebird release android --flutter-version=3.29.0 --verbose

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorebird-android-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

  release-ios:
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-14
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Shorebird Doctor
        run: shorebird doctor --verbose

      - name: Shorebird Release iOS (No CodeSign)
        run: shorebird release ios --flutter-version=3.29.0 --no-codesign --verbose

      - name: Upload iOS Release Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorebird-ios-release
          path: |
            build/ios/archive/*.xcarchive
            build/ios/ipa/*.ipa
          if-no-files-found: warn
