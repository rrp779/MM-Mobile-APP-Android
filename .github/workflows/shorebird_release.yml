name: Shorebird Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build release for'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  release-android:
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android Keystore
        run: |
          echo "storePassword=123456" > android/key.properties
          echo "keyPassword=123456" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          echo "" | base64 --decode > android/app/upload-keystore.jks
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - run: shorebird doctor --verbose
      - run: shorebird release android --verbose
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-android-release
          path: build/app/outputs/bundle/release/app-release.aab

  release-ios:
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-14
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - run: shorebird doctor --verbose
      - run: shorebird release ios --no-codesign --verbose
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-ios-release
          path: build/ios/ipa/*.ipa
