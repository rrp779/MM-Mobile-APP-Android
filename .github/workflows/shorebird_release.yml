name: Shorebird Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build release for'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  release-android:
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Decode Android Keystore and configure key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Shorebird Doctor
        run: shorebird doctor --verbose

      - name: Shorebird Release Android
        run: shorebird release android --flutter-version=3.41.6 --verbose

      - name: Verify AAB contains the Shorebird engine
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          TMP=$(mktemp -d)
          unzip -q -o "$AAB" 'base/lib/arm64-v8a/libflutter.so' -d "$TMP"
          if ! strings -a "$TMP/base/lib/arm64-v8a/libflutter.so" | grep -q 'shorebird_check_for_downloadable_update'; then
            echo "::error::libflutter.so has no Shorebird updater symbols. This AAB cannot receive OTA patches - do not upload it."
            exit 1
          fi
          echo "Shorebird engine detected in AAB."

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorebird-android-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

  release-ios:
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-15
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed s/\"//g)

          # Apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/b523a6a6-3a4e-4544-afaa-1243a9079724.mobileprovision
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/MakeupMystery_AppStore.mobileprovision
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Shorebird Doctor
        run: shorebird doctor --verbose

      - name: Shorebird Release iOS
        run: shorebird release ios --flutter-version=3.41.6 --export-options-plist=ios/ExportOptions.plist --verbose

      - name: Find IPA file path
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Error: No .ipa file found in build/ios/ipa!"
            exit 1
          fi
          echo "Found IPA at: $IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV

      - name: Verify IPA contains the Shorebird engine
        run: |
          TMP=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$TMP"
          APP=$(find "$TMP/Payload" -maxdepth 1 -name "*.app" | head -n 1)
          echo "Bundle: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" \
               "version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" \
               "($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
          ENGINE="$APP/Frameworks/Flutter.framework/Flutter"
          if ! { nm -gU "$ENGINE" 2>/dev/null; strings -a "$ENGINE"; } | grep -q 'shorebird_check_for_downloadable_update'; then
            echo "::error::Flutter.framework has no Shorebird updater symbols. This IPA cannot receive OTA patches - not uploading."
            exit 1
          fi
          echo "Shorebird engine detected in IPA."

      - name: Upload iOS Release Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorebird-ios-release
          path: |
            build/ios/archive/*.xcarchive
            build/ios/ipa/*.ipa
          if-no-files-found: warn

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
